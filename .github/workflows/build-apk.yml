name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Восстанавливаем единый фиксированный debug.keystore
      - name: Restore Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          echo "node/4N49AAAAIAAAACAAAAAQALYW5kcm9pZGRlYnVna2V5AAAAAV9b9yYAAAT3MIIE
          9zA3BgNVHQ4EMARAFO9/2pWzZ7sWpXpG8M/A4QAAAADBGA1UdIwEB/wQFMAMCAQAw
          DwYDVR0TAQH/BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOCAQEAM1N38S4i6TqI3v5E
          N1x5/K7wN632J0pW2wR1v5Y1w8+8A9R3aN+4s3r0jO3+z2J38S4i6TqI3v5EN1x5
          /K7wN632J0pW2wR1v5Y1w8+8A9R3aN+4s3r0jO3+z2J38S4i6TqI3v5EN1x5/K7w
          N632J0pW2wR1v5Y1w8+8A9R3aN+4s3r0jO3+z2J38S4i6TqI3v5EN1x5/K7wN632
          J0pW2wR1v5Y1w8+8A9R3aN+4s3r0jO3+z2J38S4i6TqI3v5EN1x5/K7wN632J0pW" | base64 -d > ~/.android/debug.keystore || true

          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          fi

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html app.js package.json manifest.json icon-*.png www/ 2>/dev/null || true

      - name: Add Android & Sync Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rectification-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: latest
          name: "Автоматическая сборка"
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
