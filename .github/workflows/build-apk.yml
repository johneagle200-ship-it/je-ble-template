name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Fixed Debug Keystore
        run: |
          mkdir -p ~/.android ~/.config/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            cp debug.keystore ~/.config/.android/debug.keystore
          fi

      - name: Install Dependencies
        run: npm install

      - name: Patch package.json version
        run: |
          sed -i -E "s/\"version\": \"[^\"]+\"/\"version\": \"1.0.${GITHUB_RUN_NUMBER}\"/" package.json
                
      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp *.html *.js package.json manifest.json icon-*.png www/ 2>/dev/null || true

      - name: Add Android & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Ensure Keystore in Android App Module
        run: |
          if [ -f debug.keystore ]; then
            cp debug.keystore android/app/debug.keystore 2>/dev/null || true
          fi

      - name: Patch build.gradle for Fixed Debug Keystore
        run: |
          python3 - << 'EOF'
          import os

          path = "android/app/build.gradle"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              signing_code = """
          signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
          }
              """

              if "signingConfigs {" not in content:
                  content = content.replace("android {", "android {\n" + signing_code, 1)

              if "buildTypes {" in content and "signingConfig signingConfigs.debug" not in content:
                  content = content.replace("buildTypes {", "buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }", 1)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF

      - name: Patch AndroidManifest.xml for Permissions
        run: |
          python3 - << 'EOF'
          import os

          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if "xmlns:tools=" not in content:
                  content = content.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"')

              perms = """
                  <uses-permission android:name="android.permission.BLUETOOTH" tools:remove="android:maxSdkVersion" />
                  <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" tools:remove="android:maxSdkVersion" />
                  <uses-permission android:name="android.permission.BLUETOOTH_SCAN" tools:remove="android:maxSdkVersion" />
                  <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
                  <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
              """

              lines = content.splitlines()
              filtered = [l for l in lines if not any(p in l for p in ["BLUETOOTH", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "bluetooth_le", "REQUEST_INSTALL_PACKAGES"])]
              content = "\n".join(filtered)

              content = content.replace("<application", perms + "\n    <application", 1)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF

      - name: Replace Android App Icons
        run: |
          if [ -f icon-512.png ]; then
            find android/app/src/main/res/ -type f \( -name "ic_launcher*.png" -o -name "ic_launcher*.webp" \) -exec cp icon-512.png {} \;
            rm -rf android/app/src/main/res/mipmap-*/ic_launcher*.xml 2>/dev/null || true
          fi

      - name: Configure Auto-Versioning
        run: |
          node -e '
            const fs = require("fs");
            
            // Читаем мажорную и минорную версию из package.json (например, "1.1")
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const parts = pkg.version.split(".");
            const major = parts[0] || "1";
            const minor = parts[1] || "0";
            
            const newVersion = `${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`;
            
            // Записываем итоговую версию обратно в package.json
            pkg.version = newVersion;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
            
            // Обновляем build.gradle для Android
            const gradlePath = "android/app/build.gradle";
            if (fs.existsSync(gradlePath)) {
              let gradle = fs.readFileSync(gradlePath, "utf8");
              gradle = gradle.replace(/versionCode\s+[0-9]+/, `versionCode ${process.env.GITHUB_RUN_NUMBER}`);
              gradle = gradle.replace(/versionName\s+\"[^\"]+\"/, `versionName "${newVersion}"`);
              fs.writeFileSync(gradlePath, gradle, "utf8");
            }
            
            console.log(`Version set to: ${newVersion}, Code: ${process.env.GITHUB_RUN_NUMBER}`);
          '
      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.testOnly=false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: je-ble-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Сборка v1.0.${{ github.run_number }}"
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
