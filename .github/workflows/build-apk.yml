name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Fixed Debug Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > ~/.android/debug.keystore

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html app.js BaseBLEDevice.js package.json manifest.json icon-*.png www/ 2>/dev/null || true

      - name: Add Android & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Patch AndroidManifest.xml for BLE Permissions
        run: |
          python3 -c '
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          perms = """
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
          """
          with open(path, "r") as f:
              content = f.read()

          # Очищаем старые дублирующиеся записи разрешений
          content = re.sub(r"\s*<uses-permission android:name=\"android\.permission\.BLUETOOTH[^\"]*\"[^>]*/>", "", content)
          content = re.sub(r"\s*<uses-permission android:name=\"android\.permission\.ACCESS_[^\"]*\"[^>]*/>", "", content)
          content = re.sub(r"\s*<uses-feature android:name=\"android\.hardware\.bluetooth_le\"[^>]*/>", "", content)

          # Вставляем чистый блок разрешений перед <application
          content = content.replace("<application", perms + "\n    <application")

          with open(path, "w") as f:
              f.write(content)
          '

      - name: Replace Android App Icons
        run: |
          find android/app/src/main/res/ -type f \( -name "ic_launcher*.png" -o -name "ic_launcher*.webp" \) -exec cp icon-512.png {} \;
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.xml

      - name: Configure Android Signing & Version Code
        run: |
          mkdir -p android/app
          cp ~/.android/debug.keystore android/app/debug.keystore
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/g" android/app/build.gradle
          python3 -c '
          with open("android/app/build.gradle", "r") as f:
              content = f.read()

          config = """
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }"""

          if "storeFile file" not in content:
              content = content.replace("buildTypes {", config + "\n    buildTypes {")
              with open("android/app/build.gradle", "w") as f:
                  f.write(content)
          '

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: je-ble-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: latest
          name: "Автоматическая сборка"
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
