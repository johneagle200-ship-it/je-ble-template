name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp *.html *.js package.json manifest.json icon-*.png www/ 2>/dev/null || true

      - name: Add Android & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Ensure Keystore in Android App Module
        run: |
          if [ -f debug.keystore ]; then
            cp debug.keystore android/app/debug.keystore 2>/dev/null || true
          fi

      - name: Patch AndroidManifest.xml for BLE Permissions
        run: |
          python3 - << 'EOF'
          import os

          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if "xmlns:tools=" not in content:
                  content = content.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"')

              perms = """
                  <uses-permission android:name="android.permission.BLUETOOTH" tools:remove="android:maxSdkVersion" />
                  <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" tools:remove="android:maxSdkVersion" />
                  <uses-permission android:name="android.permission.BLUETOOTH_SCAN" tools:remove="android:maxSdkVersion" />
                  <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
              """

              lines = content.splitlines()
              filtered = [l for l in lines if not any(p in l for p in ["BLUETOOTH", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "bluetooth_le"])]
              content = "\n".join(filtered)

              content = content.replace("<application", perms + "\n    <application", 1)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF

      - name: Replace Android App Icons
        run: |
          if [ -f icon-512.png ]; then
            find android/app/src/main/res/ -type f \( -name "ic_launcher*.png" -o -name "ic_launcher*.webp" \) -exec cp icon-512.png {} \;
            rm -rf android/app/src/main/res/mipmap-*/ic_launcher*.xml 2>/dev/null || true
          fi

      - name: Configure Auto-Versioning
        run: |
          sed -i -E "s/versionCode([ =]+)[0-9]+/versionCode\1${GITHUB_RUN_NUMBER}/g" android/app/build.gradle 2>/dev/null || true
          sed -i -E "s/versionName([ =]+)\"[^\"]+\"/versionName\1\"1.0.${GITHUB_RUN_NUMBER}\"/g" android/app/build.gradle 2>/dev/null || true

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.testOnly=false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: je-ble-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: latest
          name: "Отладочная сборка (Debug)"
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
