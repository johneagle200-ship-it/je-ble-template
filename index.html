<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JE Device</title>
  <meta name="theme-color" content="#121212">
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #121212; 
      color: #fff; 
      margin: 0; 
      padding: 0; 
      text-align: center; 
    }

    /* Верхняя панель прибора */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      width: 100%;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .header-title h2 { margin: 0; font-size: 16px; font-weight: 600; }

    /* Бейдж версии в одну строку без переносов */
    .ver-badge { 
      font-size: 11px; 
      background: #2a2a2a; 
      color: #00e676; 
      padding: 2px 6px; 
      border-radius: 8px; 
      border: 1px solid #00e67644; 
      font-weight: bold; 
      white-space: nowrap;
      display: inline-block;
      line-height: 1.2;
    }

    /* Кнопка гамбургер строго в правом углу */
    .menu-btn {
      position: relative;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-left: auto;
    }

    .hamburger-line {
      width: 22px;
      height: 2px;
      background-color: #fff;
      border-radius: 2px;
    }

    .menu-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 10px;
      height: 10px;
      background-color: #ff3b30;
      border-radius: 50%;
      border: 2px solid #1e1e1e;
    }

    /* Главный рабочий экран */
    .main-container { 
      padding: 15px; 
      padding-bottom: 80px; /* Отступ снизу под плавающую кнопку */
    }

    .card { 
      background: #1e1e1e; 
      padding: 16px; 
      border-radius: 12px; 
      margin-bottom: 15px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
    }

    .device-info { font-size: 14px; color: #aaa; margin-bottom: 6px; }
    .status { font-weight: bold; color: #ff5252; }
    .status.connected { color: #00e676; }
    .status.pending { color: #ffca28; }
    .val { font-size: 36px; font-weight: bold; color: #00e676; margin-top: 8px; }

    /* Нижняя плавающая панель (появляется только если НЕТ связи) */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 15px;
      background: #181818;
      border-top: 1px solid #2a2a2a;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
      z-index: 100;
    }

    /* Шторка меню */
    .menu-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      display: flex;
      justify-content: flex-end;
    }

    .menu-content {
      width: 280px;
      height: 100%;
      background: #1e1e1e;
      color: #fff;
      padding: 20px;
      box-shadow: -4px 0 15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .menu-header h3 { margin: 0; font-size: 16px; }

    .btn-close {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
    }

    .info-card {
      background: #2a2a2a;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .info-card p { margin: 0; color: #ccc; }
    .info-card strong { color: #fff; }

    .update-card {
      background: #2b2200;
      border: 1px solid #ffca28;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .update-card p { margin: 0 0 10px 0; font-size: 13px; font-weight: bold; color: #ffca28; }

    .btn-group-vertical {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button { 
      background: #007bff; 
      color: white; 
      border: none; 
      padding: 12px 16px; 
      font-size: 15px; 
      font-weight: 600; 
      border-radius: 10px; 
      cursor: pointer; 
      width: 100%;
    }

    button.btn-danger { background: #dc3545; }
    button.btn-secondary { background: #3a3a3a; color: #eee; }
    button.btn-warning { background: #ff9800; color: #000; }
    hr.divider { border: 0; height: 1px; background: #333; margin: 15px 0; }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="app-header">
    <div class="header-title">
      <h2 id="appTitle">JE Device</h2>
      <span id="espFwVersion" class="ver-badge">v--</span>
    </div>

    <!-- Кнопка вызова настроек -->
    <button id="btnMenu" class="menu-btn" onclick="app.toggleMenu()">
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
      <span id="menuBadge" class="menu-badge" style="display: none;"></span>
    </button>
  </header>

  <!-- Рабочая область -->
  <main class="main-container">
    <div class="card">
      <div class="device-info">
        Устройство: <b id="deviceName">Не выбрано</b>
      </div>
      <div>Статус: <span id="bleStatus" class="status">Отключено</span></div>
    </div>

    <!-- Карточка с данными телеметрии -->
    <div class="card">
      <div style="color: #aaa; font-size: 14px;">Данные с ESP32:</div>
      <div id="telemetryData" class="val">--</div>
    </div>
  </main>

  <!-- Нижняя кнопка (появляется только в состоянии "Отключено") -->
  <div id="bottomConnectBar" class="bottom-bar">
    <button id="btnConnect" onclick="app.connectOrReconnect()">Подключиться</button>
  </div>

  <!-- Боковое меню -->
  <div id="settingsMenu" class="menu-drawer" style="display: none;">
    <div class="menu-content">
      <div class="menu-header">
        <h3>Настройки и Система</h3>
        <button class="btn-close" onclick="app.toggleMenu()">&times;</button>
      </div>

      <div class="info-card">
        <p>Приложение: <strong id="appVersion">v--</strong></p>
        <p>Прошивка ESP32: <strong id="espFwText">v--</strong></p>
        <p>Связь: <strong id="bleStatusInMenu">Отключено</strong></p>
      </div>

      <!-- Блок обновлений -->
      <div id="updateNotice" class="update-card" style="display: none;">
        <p id="updateNoticeText">Обнаружено обновление!</p>
        <div class="btn-group-vertical">
          <button id="btnUpdateApp" style="display:none;" onclick="app.updateApp()">Обновить Приложение</button>
          <button id="btnUpdateFW" class="btn-warning" style="display:none;" onclick="app.updateESP32Firmware()">Прошить ESP32</button>
        </div>
      </div>

      <!-- Системные функции -->
      <div class="btn-group-vertical">
        <button id="btnCheckUpdates" class="btn-secondary" onclick="app.manualCheckUpdates()">Проверить обновления</button>
        <button id="btnSelectNew" onclick="app.selectNewDevice()" class="btn-secondary">Сменить устройство</button>
        
        <hr class="divider">

        <!-- Отключение уходит в глубокое меню -->
        <button id="btnDisconnect" onclick="app.disconnectBLE()" style="display: none;" class="btn-danger">Отключить устройство</button>
      </div>
    </div>
  </div>

  <script src="BaseBLEDevice.js"></script>
  <script src="app.js"></script>
</body>
</html>
