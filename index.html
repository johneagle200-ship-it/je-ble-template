<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JE Device</title>
  <meta name="theme-color" content="#121212">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 15px; margin: 0; text-align: center; }
    .header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; }
    .header h2 { margin: 0; }
    .ver-badge { font-size: 12px; background: #2a2a2a; color: #00e676; padding: 2px 8px; border-radius: 10px; border: 1px solid #00e67644; font-weight: bold; }
    .card { background: #1e1e1e; padding: 16px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .device-info { font-size: 14px; color: #aaa; margin-bottom: 10px; }
    .status { font-weight: bold; color: #ff5252; }
    .status.connected { color: #00e676; }
    .status.pending { color: #ffca28; }
    .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    button { background: #007bff; color: white; border: none; padding: 10px 18px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; }
    button.btn-danger { background: #dc3545; }
    button.btn-secondary { background: #444; }
    button.btn-warning { background: #ff9800; color: #000; }
    .val { font-size: 26px; font-weight: bold; color: #00e676; margin-top: 4px; }
    .update-box { background: #2b2200; border: 1px solid #ffca28; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h2 id="appTitle">JE Устройство</h2>
    <span id="appVersion" class="ver-badge">v--</span>
  </div>

  <!-- Блок уведомлений об обновлениях -->
  <div id="updateNotice" class="update-box">
    <div id="updateNoticeText" style="margin-bottom: 8px; font-weight: bold;"></div>
    <div class="btn-group">
      <button id="btnUpdateApp" style="display:none;" onclick="app.updateApp()">Обновить Приложение</button>
      <button id="btnUpdateFW" class="btn-warning" style="display:none;" onclick="app.updateESP32Firmware()">Обновить Прошивку ESP32</button>
    </div>
  </div>

  <!-- Управление BLE -->
  <div class="card">
    <div class="device-info">
      Устройство: <b id="deviceName">Не выбрано</b> 
      <span id="espFwVersion" style="color:#888;"></span>
    </div>
    <div>Статус: <span id="bleStatus" class="status">Отключено</span></div>

    <div class="btn-group">
      <button id="btnConnect" onclick="app.connectOrReconnect()">Подключиться</button>
      <button id="btnDisconnect" onclick="app.disconnectBLE()" style="display: none;" class="btn-danger">Отключить</button>
      <button id="btnSelectNew" onclick="app.selectNewDevice()" class="btn-secondary">Сменить устройство</button>
    </div>
  </div>

  <!-- Блок данных -->
  <div class="card">
    <div>Данные с ESP32: <div id="telemetryData" class="val">--</div></div>
  </div>

  <script src="BaseBLEDevice.js"></script>
  <script src="app.js"></script>
</body>
</html>
