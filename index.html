<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JE Device</title>
  <meta name="theme-color" content="#121212">
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #121212; 
      color: #fff; 
      margin: 0; 
      padding: 0; 
      text-align: center; 
    }

    /* Верхняя панель прибора */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title h2 { margin: 0; font-size: 18px; }
    .ver-badge { 
      font-size: 11px; 
      background: #2a2a2a; 
      color: #00e676; 
      padding: 2px 6px; 
      border-radius: 8px; 
      border: 1px solid #00e67644; 
      font-weight: bold; 
    }

    /* Кнопка гамбургер с красной точкой */
    .menu-btn {
      position: relative;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hamburger-line {
      width: 22px;
      height: 2px;
      background-color: #fff;
      border-radius: 2px;
    }
    .menu-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 10px;
      height: 10px;
      background-color: #ff3b30;
      border-radius: 50%;
      border: 2px solid #1e1e1e;
    }

    /* Главный экран и карточки */
    .main-container { padding: 15px; }
    .card { 
      background: #1e1e1e; 
      padding: 20px; 
      border-radius: 12px; 
      margin-bottom: 15px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
    }
    .device-info { font-size: 14px; color: #aaa; margin-bottom: 10px; }
    .status { font-weight: bold; color: #ff5252; }
    .status.connected { color: #00e676; }
    .status.pending { color: #ffca28; }
    .val { font-size: 32px; font-weight: bold; color: #00e676; margin-top: 8px; }

    /* Выпадающая шторка / меню */
    .menu-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      display: flex;
      justify-content: flex-end;
    }
    .menu-content {
      width: 300px;
      height: 100%;
      background: #1e1e1e;
      color: #fff;
      padding: 20px;
      box-shadow: -4px 0 15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .menu-header h3 { margin: 0; font-size: 16px; }
    .btn-close {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
    }

    /* Информационные блоки в меню */
    .info-card {
      background: #2a2a2a;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .info-card p { margin: 0; color: #ccc; }
    .info-card strong { color: #fff; }

    .update-card {
      background: #2b2200;
      border: 1px solid #ffca28;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .update-card p { margin: 0 0 10px 0; font-size: 13px; font-weight: bold; color: #ffca28; }

    /* Кнопки */
    .btn-group-vertical {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button { 
      background: #007bff; 
      color: white; 
      border: none; 
      padding: 11px 16px; 
      font-size: 14px; 
      font-weight: 600; 
      border-radius: 8px; 
      cursor: pointer; 
      width: 100%;
    }
    button.btn-danger { background: #dc3545; }
    button.btn-secondary { background: #3a3a3a; color: #eee; }
    button.btn-warning { background: #ff9800; color: #000; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    hr.divider { border: 0; height: 1px; background: #333; margin: 15px 0; }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <header class="app-header">
    <div class="header-title">
      <h2 id="appTitle">JE Устройство</h2>
      <span id="espFwVersion" class="ver-badge">v--</span>
    </div>

    <!-- Гамбургер-меню с бейджем уведомлений -->
    <button id="btnMenu" class="menu-btn" onclick="app.toggleMenu()">
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
      <span id="menuBadge" class="menu-badge" style="display: none;"></span>
    </button>
  </header>

  <!-- Главный рабочий экран -->
  <main class="main-container">
    <div class="card">
      <div class="device-info">
        Устройство: <b id="deviceName">Не выбрано</b>
      </div>
      <div>Статус: <span id="bleStatus" class="status">Отключено</span></div>
    </div>

    <!-- Блок основной телеметрии -->
    <div class="card">
      <div style="color: #aaa; font-size: 14px;">Данные с ESP32:</div>
      <div id="telemetryData" class="val">--</div>
    </div>
  </main>

  <!-- Шторка меню настройки / системы -->
  <div id="settingsMenu" class="menu-drawer" style="display: none;">
    <div class="menu-content">
      <div class="menu-header">
        <h3>Настройки и Система</h3>
        <button class="btn-close" onclick="app.toggleMenu()">&times;</button>
      </div>

      <!-- Информация о версиях -->
      <div class="info-card">
        <p>Приложение: <strong id="appVersion">v--</strong></p>
        <p>Прошивка ESP32: <strong id="espFwText">v--</strong></p>
        <p>Связь: <strong id="bleStatusInMenu">Отключено</strong></p>
      </div>

      <!-- Блок найденных обновлений -->
      <div id="updateNotice" class="update-card" style="display: none;">
        <p id="updateNoticeText">Обнаружено обновление!</p>
        <div class="btn-group-vertical">
          <button id="btnUpdateApp" style="display:none;" onclick="app.updateApp()">Обновить Приложение</button>
          <button id="btnUpdateFW" class="btn-warning" style="display:none;" onclick="app.updateESP32Firmware()">Прошить ESP32</button>
        </div>
      </div>

      <!-- Действия с системой -->
      <div class="btn-group-vertical">
        <button id="btnCheckUpdates" class="btn-secondary" onclick="app.manualCheckUpdates()">Проверить обновления</button>
        
        <hr class="divider">

        <button id="btnConnect" onclick="app.connectOrReconnect()">Подключиться</button>
        <button id="btnSelectNew" onclick="app.selectNewDevice()" class="btn-secondary">Сменить устройство</button>
        <button id="btnDisconnect" onclick="app.disconnectBLE()" style="display: none;" class="btn-danger">Отключить</button>
      </div>
    </div>
  </div>

  <script src="BaseBLEDevice.js"></script>
  <script src="app.js"></script>
</body>
</html>
